<mat-card class="mat-content">
  <mat-card-header>
    <mat-card-title>Top {{ this.chartData.labels?.length }} Promedio por Docente</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if(loading()){
    <div class="spinner"><mat-spinner diameter="36"></mat-spinner></div>
    } @else {
    <div class="chart-container">
      <canvas baseChart [data]="chartData" [options]="chartOptions" [type]="chartType"></canvas>
    </div>
    }
  </mat-card-content>
</mat-card>
