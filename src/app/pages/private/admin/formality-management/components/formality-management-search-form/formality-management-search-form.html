<mat-expansion-panel class="search-panel">
  <mat-expansion-panel-header>
    <mat-panel-title>
      <mat-icon>search</mat-icon>
      <span>Buscar Trámites</span>
    </mat-panel-title>
    <mat-panel-description>
      Filtra por título, descripción o rango de fechas
    </mat-panel-description>
  </mat-expansion-panel-header>

  <form [formGroup]="formGroup" class="search-form">
    <div class="form-row">
      <div class="form-field">
        <app-input
          id="title"
          [control]="formGroup.controls.title"
          [label]="'Título'"
          [placeholder]="'Buscar por título...'"
          variant="outline"
        ></app-input>
      </div>

      <div class="form-field">
        <app-input
          id="description"
          [control]="formGroup.controls.description"
          [label]="'Descripción'"
          [placeholder]="'Buscar por descripción...'"
          variant="outline"
        ></app-input>
      </div>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Ingrese rango de fechas</mat-label>
        <mat-date-range-input [rangePicker]="picker">
          <input matStartDate placeholder="Fecha inicio" [formControl]="formGroup.controls.from" />
          <input matEndDate placeholder="Fecha fin" [formControl]="formGroup.controls.to" />
        </mat-date-range-input>
        <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-date-range-picker #picker></mat-date-range-picker>
      </mat-form-field>
    </div>

    <div class="form-field form-actions">
      <div class="search-actions">
        <button mat-raised-button color="primary" type="button" (click)="onApplyFilters()">
          <mat-icon>search</mat-icon>
          Aplicar Filtros
        </button>
        <button mat-raised-button color="warn" type="button" (click)="onClearFilters()">
          <mat-icon>clear_all</mat-icon>
          Limpiar Filtros
        </button>
      </div>
    </div>
  </form>
</mat-expansion-panel>
