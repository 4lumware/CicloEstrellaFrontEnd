<mat-card class="comment-detail-card">
  <mat-card-header>
    <mat-card-title>Detalle del Comentario</mat-card-title>
    <mat-card-subtitle
      >{{ data.author.username }} · {{ data.createdAt | date : 'short' }}</mat-card-subtitle
    >
  </mat-card-header>

  <mat-card-content>
    <p class="comment-text">{{ data.text }}</p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button color="primary" (click)="close()">
      <mat-icon>close</mat-icon>
      Cerrar
    </button>
  </mat-card-actions>
</mat-card>
