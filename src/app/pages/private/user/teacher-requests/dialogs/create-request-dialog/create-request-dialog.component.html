<mat-card class="teacher-create-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Solicitar creación de Docente</mat-card-title>
  </mat-card-header>
  <mat-card-content class="card-content">
    <form [formGroup]="form" class="dialog-form">
      <div class="form-container">
        <app-input
          [id]="'firstName'"
          [label]="'Nombre'"
          [control]="form.controls.firstName"
        ></app-input>

        <app-input
          [id]="'lastName'"
          [label]="'Apellido'"
          [control]="form.controls.lastName"
        ></app-input>

        <div class="full-width">
          <app-select
            [id]="'courseIds'"
            [label]="'Asignaturas'"
            [options]="courseOptions"
            [control]="form.controls.courseIds"
            [multiple]="true"
          ></app-select>
        </div>

        <app-select
          [id]="'careerIds'"
          [label]="'Carreras'"
          [options]="careerOptions"
          [control]="form.controls.careerIds"
          [multiple]="true"
        ></app-select>
        <app-select
          [id]="'campusIds'"
          [label]="'Campus'"
          [options]="campusOptions"
          [control]="form.controls.campusIds"
          [multiple]="true"
        ></app-select>

        <mat-form-field appearance="outline" class="full-width full-span">
          <mat-label>Descripción</mat-label>
          <textarea
            class="text-area-input"
            matInput
            cdkTextareaAutosize
            cdkAutosizeMinRows="1"
            cdkAutosizeMaxRows="3"
            formControlName="generalDescription"
          ></textarea>
        </mat-form-field>
        <div class="full-width">
          <app-profile-image-uploader
            [control]="form.controls.profilePictureUrl"
            label="Inserte la Foto del Docente"
          ></app-profile-image-uploader>
        </div>
      </div>
    </form>
    <mat-card-actions>
      <section class="button-actions">
        <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
          Enviar Solicitud
        </button>
        <button mat-button mat-dialog-close>Cancelar</button>
      </section>
    </mat-card-actions>
  </mat-card-content>
</mat-card>
