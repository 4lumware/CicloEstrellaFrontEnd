<mat-card (click)="onViewDetails()" class="request-card">
  <mat-card-header>
    <mat-card-title>Solicitud: {{ request.id }}</mat-card-title>
    <mat-card-subtitle>
      <span class="status-badge pending">Pendiente</span>
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="card-content">
    <div class="content">
      <div class="left">
        <img [src]="request.content?.profilePictureUrl" alt="avatar" class="avatar" />
      </div>
      <div class="mid">
        <div class="label">Docente</div>
        <div class="value">{{ request.content?.name || request.content?.firstName || 'N/A' }}</div>
        <div class="small">Creado: {{ request.createdAt | date : 'short' }}</div>
      </div>

      <div class="right">
        <button
          mat-stroked-button
          color="warn"
          (click)="cancel(); $event.stopPropagation()"
          [disabled]="loading()"
        >
          <mat-icon>cancel</mat-icon>
          Cancelar
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
