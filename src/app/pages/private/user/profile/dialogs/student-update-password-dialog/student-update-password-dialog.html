<mat-dialog-content>
  <p class="mat-dialog-title">Cambia tu contraseña</p>
  <form [formGroup]="passwordForm" class="password-form">
    <app-input
      id="oldPassword"
      [label]="'Contraseña Antigua'"
      [placeholder]="'Ingrese su contraseña antigua...'"
      [control]="passwordForm.controls.oldPassword"
      variant="outline"
      type="password"
    ></app-input>
    <app-input
      id="newPassword"
      [label]="'Contraseña Nueva'"
      [placeholder]="'Ingrese su contraseña nueva...'"
      [control]="passwordForm.controls.newPassword"
      variant="outline"
      type="password"
    ></app-input>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">No</button>
  <button matButton="filled" (click)="onClickUpdatePassword()" cdkFocusInitial>
    Cambiar Contraseña
  </button>
</mat-dialog-actions>
