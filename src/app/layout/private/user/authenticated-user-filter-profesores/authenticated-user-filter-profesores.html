<div class="filtro-panel mat-elevation-z4">
  <div class="filtro-header">
    <h2><mat-icon inline>filter_list</mat-icon> Filtros</h2>
    <button mat-icon-button (click)="closeFiltro()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="filtro-opciones">

    <div class="filtro-opcion full-width">
      <label class="section-label">Sede:</label>
      <div class="sede-container">
        <ng-container *ngFor="let campus of campuses">
          <button *ngIf="selectedCampusId === campus.id"
                  mat-flat-button
                  class="sede-btn"
                  (click)="selectSede(campus.id)">
            {{ campus.campusName }}
          </button>
          <button *ngIf="selectedCampusId !== campus.id"
                  mat-stroked-button
                  class="sede-btn"
                  (click)="selectSede(campus.id)">
            {{ campus.campusName }}
          </button>
        </ng-container>
      </div>
    </div>

    <div class="filtro-opcion">
      <mat-form-field appearance="outline">
        <mat-label>Curso</mat-label>
        <mat-select [(ngModel)]="selectedCourseId">
          <mat-option [value]="null">Todos los cursos</mat-option>
          <mat-option *ngFor="let course of courses" [value]="course.id">
            {{ course.courseName }}
          </mat-option>
        </mat-select>
        <mat-icon matSuffix>book</mat-icon>
      </mat-form-field>
    </div>

    <div class="filtro-opcion">
      <mat-form-field appearance="outline">
        <mat-label>Carreras</mat-label>
        <mat-select [(ngModel)]="selectedCareerId">
          <mat-option [value]="null">Todas las carreras</mat-option>
          <mat-option *ngFor="let career of careers" [value]="career.id">
            {{ career.careerName }}
          </mat-option>
        </mat-select>
        <mat-icon matSuffix>school</mat-icon>
      </mat-form-field>
    </div>

  </div>

  <div class="filtro-botones">
    <button mat-flat-button (click)="applyFilters()" class="action-btn btn-aplicar">
      Aplicar Filtros
    </button>
    <button mat-flat-button (click)="resetFilters()" class="action-btn btn-borrar">
      Borrar Filtros
    </button>
  </div>
</div>
